<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WSO 指标数据录入</title>
  <script src="tailwind.js"></script>
  <script src="exceljs.min.js"></script>
  <script src="template.js"></script>
  <script src="app.js" defer></script>
  <style>
    .field-hidden { display: none !important; }
    .hidden { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">WSO 指标数据录入</h1>
        <p class="text-sm text-slate-500 mt-0.5">按 <span class="font-medium">WSO指标数据导入模板.xlsx</span> 格式填写并导出 · 数据自动保存在本地浏览器</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm text-slate-500">共 <span id="count-badge" class="font-semibold text-slate-700">0</span> 条</span>
        <button id="btn-clear-all" type="button" class="px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition">清空全部</button>
        <button id="btn-export" type="button" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition shadow-sm">导出 Excel</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-base font-semibold text-slate-800">记录列表</h2>
        <button id="btn-add" type="button" class="px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg transition shadow-sm">+ 新增记录</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead>
            <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
              <th class="px-4 py-3 font-medium">患者编号</th>
              <th class="px-4 py-3 font-medium">年龄</th>
              <th class="px-4 py-3 font-medium">性别</th>
              <th class="px-4 py-3 font-medium">发病时间</th>
              <th class="px-4 py-3 font-medium">到达时间</th>
              <th class="px-4 py-3 font-medium">卒中类型</th>
              <th class="px-4 py-3 font-medium">出院去向</th>
              <th class="px-4 py-3 font-medium">出院日期</th>
              <th class="px-4 py-3 font-medium text-right">操作</th>
            </tr>
          </thead>
          <tbody id="list-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 编辑弹窗 -->
  <div id="editor-modal" class="hidden fixed inset-0 z-40 bg-black/40 items-start justify-center overflow-y-auto py-8">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white rounded-t-2xl">
        <h3 id="modal-title" class="text-lg font-semibold text-slate-900">新增记录</h3>
        <button id="btn-cancel-record" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
      </div>
      <div id="editor-fields" class="px-6 py-4 overflow-y-auto flex-1"></div>
      <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-3 sticky bottom-0 bg-white rounded-b-2xl">
        <button id="btn-cancel-record2" type="button" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">取消</button>
        <button id="btn-save-record" type="button" class="px-5 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition shadow-sm">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 bg-slate-900 text-white text-sm rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity z-50"></div>
</body>
</html>
